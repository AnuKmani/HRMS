; HRMS Queue Worker Supervisor Configuration
;
; Install: sudo apt-get install supervisor
; Copy to: /etc/supervisor/conf.d/hrms-worker.conf
; Reload: sudo supervisorctl reread && sudo supervisorctl update
; Status: sudo supervisorctl status hrms-worker:*

[program:hrms-worker]
; Command to run the queue worker
command=php /var/www/hrms/backend/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-jobs=1000 --max-time=3600

; Number of worker processes (adjust based on CPU cores and workload)
numprocs=2
process_name=%(program_name)s_%(process_num)02d

; User to run as (create dedicated user for HRMS)
user=www-data
group=www-data

; Working directory
directory=/var/www/hrms/backend

; Autostart and autorestart
autostart=true
autorestart=true

; Startup and shutdown
startsecs=5
startretries=3
stopwaitsecs=60
stopsignal=TERM

; Logging
stdout_logfile=/var/log/supervisor/hrms-worker-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/hrms-worker-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Environment variables
environment=APP_ENV="production",APP_DEBUG="false",PATH="/usr/local/bin:/usr/bin:/bin"

; Priority (higher = started first, stopped last)
priority=999

; Resource limits (optional, adjust as needed)
; rlimit_nofile=65536
; rlimit_nproc=4096

; Restart on unexpected exit
autorestart=unexpected

; Kill signal
stopsignal=TERM