# HRMS Production Nginx Configuration
#
# This is an example production Nginx configuration for HRMS.
# Copy to /etc/nginx/sites-available/hrms and symlink to sites-enabled.
#
# IMPORTANT: Replace yourdomain.com with your actual domain.
# IMPORTANT: SSL certificates must be configured before enabling HTTPS server block.
# IMPORTANT: Adjust paths to match your deployment directory structure.

# Upstream PHP-FPM
upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
    # Alternative TCP: server 127.0.0.1:9000;
}

# Rate limiting zones (optional, can also use Laravel's built-in)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Configuration (configure with Certbot or your CA)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (enable only after HTTPS is verified working)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), accelerometer=(), gyroscope=()" always;
    # CSP - adjust as needed for your frontend
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://fcm.googleapis.com;" always;

    # Root directory - Laravel public folder
    root /var/www/hrms/backend/public;
    index index.php;

    # Access logs
    access_log /var/log/nginx/hrms_access.log;
    error_log /var/log/nginx/hrms_error.log;

    # Maximum upload size (adjust based on HRMS config)
    client_max_body_size 15M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/rss+xml;

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|sql|log|bak|ini|conf) {
        deny all;
        return 404;
    }

    # Deny access to Laravel sensitive directories
    location ~ ^/(storage|bootstrap|vendor|config|database|resources|tests)/ {
        deny all;
        return 404;
    }

    # Deny access to .env.example, composer files
    location ~ ^/(composer\.|package\.|webpack\.|yarn\.|vite\.|artisan|\.env) {
        deny all;
        return 404;
    }

    # Prevent PHP execution in upload/private directories
    location ~* ^/(storage|private)/.*\.php$ {
        deny all;
        return 404;
    }

    # API rate limiting
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/auth/forgot-password {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/auth/reset-password {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/v1/device-tokens {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Upload endpoints
    location ~ ^/api/v1/(employee-documents|employee-training|expenses|leave|site-activity-reports|daily-site-reports|assets)/ {
        limit_req zone=upload_limit burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # General API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check - no rate limiting
    location = /health {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        # Security: prevent version disclosure
        fastcgi_hide_header X-Powered-By;

        # Security: prevent script injection
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fallback to index.php for Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}